name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download dependency jars
        run: |
          mkdir -p libs
          echo "Dependency jars are not committed (third-party mods)."
          echo "CI build expects them pre-cached or provided via secrets."
          # If you want CI to build, upload the libs as artifacts or use a private registry.
          # For now this will fail without them - see README "Building from source".

      - name: Build
        run: ./gradlew build --no-daemon
        continue-on-error: true

      - name: Unit tests
        run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test/*.xml
          retention-days: 7
